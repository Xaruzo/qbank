name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 every 3 days to ensure the project stays active
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  ping_supabase:
    environment: VITE_SUPABASE_URL
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase API
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" ]]; then
            echo "Missing SUPABASE_URL (set repo secret SUPABASE_URL or VITE_SUPABASE_URL)."
            exit 1
          fi

          if [[ "${SUPABASE_URL}" != http*://* ]]; then
            echo "SUPABASE_URL must include scheme, e.g. https://<project-ref>.supabase.co"
            exit 1
          fi

          if [[ -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "Missing SUPABASE_ANON_KEY (set repo secret SUPABASE_ANON_KEY or VITE_SUPABASE_ANON_KEY)."
            exit 1
          fi

          curl -fsS -X GET "${SUPABASE_URL}/rest/v1/questions?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
